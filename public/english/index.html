<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="South Gate：能开口说的英语口语材料。听一句，跟一句，今天就能用。" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>South Gate · 开口说</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <p class="kicker">开口练习 · B1–B2</p>
        <h1>South Gate</h1>
        <p class="lead">不要默读。每句都是你今天可以对人说的话。</p>
      </header>

      <section id="chapter-select" class="card"></section>

      <section class="modes" role="tablist" aria-label="练习方式">
        <button class="mode is-on" data-mode="shadow" type="button">跟读</button>
        <button class="mode" data-mode="you-say" type="button">你先说</button>
        <button class="mode" data-mode="chunks" type="button">口块</button>
        <button class="mode" data-mode="role" type="button">角色扮演</button>
      </section>

      <section id="stage" class="stage card"></section>

      <p class="hint">手机打开后：先听，再跟读，再说给空气听。说不顺就再听一遍。</p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
