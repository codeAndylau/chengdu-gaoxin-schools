name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          echo "=== @rolldown 目录 ==="
          ls node_modules/@rolldown/ 2>/dev/null || echo "no @rolldown dir"
          echo "=== linux binding ==="
          ls node_modules/@rolldown/binding-linux-x64-gnu/ 2>/dev/null || echo "linux binding MISSING"

      - name: Build static site
        run: |
          npx vite build --config vite.pages.config.ts > build.log 2>&1 || true
          mkdir -p out
          cp build.log out/build.log
          cat build.log
        env:
          NODE_OPTIONS: --stack-trace-limit=100

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
